services:
  - type: web
    name: face-auth-attendance
    env: docker
    plan: free # or starter if RAM issues occur
    envVars:
      - key: STREAMLIT_SERVER_PORT
        value: 10000
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_SERVER_ADDRESS
        value: "0.0.0.0"
